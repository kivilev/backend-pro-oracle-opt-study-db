# Публикация «запечённого» образа стенда: база курса уже установлена внутри образа,
# у студента первый старт занимает пару минут вместо установки с нуля.
# Запекание запускает Oracle внутри раннера, поэтому каждая архитектура собирается на своём
# нативном раннере (QEMU-эмуляция для Oracle не годится), затем теги объединяются в один манифест.
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/oracle-opt-study-db

jobs:
  bake:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (установка + коммит образа требуют ~25 ГБ)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake (install stand, verify, finalize, commit)
        run: bash bake/bake.sh "${IMAGE}:${GITHUB_SHA::7}-${{ matrix.arch }}"

      - name: Push arch image
        run: docker push "${IMAGE}:${GITHUB_SHA::7}-${{ matrix.arch }}"

  manifest:
    needs: bake
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Multi-arch manifest
        run: |
          SHA=${GITHUB_SHA::7}
          TAGS="-t ${IMAGE}:${SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then TAGS="$TAGS -t ${IMAGE}:latest"; fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAGS="$TAGS -t ${IMAGE}:${GITHUB_REF_NAME}"; fi
          docker buildx imagetools create $TAGS "${IMAGE}:${SHA}-amd64" "${IMAGE}:${SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${SHA}"
